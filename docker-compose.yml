name: airsoft-prim

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airsoft
      POSTGRES_PASSWORD: airsoft
      POSTGRES_DB: airsoft_prim
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airsoft -d airsoft_prim"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airsoft-prim

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airsoft-prim

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deploy
    image: airsoft-prim-backend:0.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - airsoft-prim

networks:
  airsoft-prim:
    name: airsoft-prim
    driver: bridge

volumes:
  postgres-data:
  minio-data:
